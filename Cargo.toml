[package]
name = "scaling"
version = "0.10.2"
authors = ["David Roundy <daveroundy@gmail.com>", "Alex Sayers <alex@asayers.com>"]
description = "A lightweight benchmarking library that measures scaling behavior"
edition = "2021"
documentation = "https://docs.rs/scaling/"
repository = "https://github.com/droundy/scaling"
readme = "README.md"
keywords = ["benchmark", "scaling"]
categories = ["development-tools::profiling"]
license = "MIT OR Apache-2.0"
exclude = [".github", ".gitignore", "prek.toml"]
# `#[expect]` was stabilized in Rust 1.81.
rust-version = "1.81"

# Ctrl-C handling needs signals, which a wasm target does not have.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ctrlc = "3.5"

# Only used to set CPU affinity, which only exists on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies]
inventory = "0.3.21"
# Pinned exactly: the macros write struct literals of this crate's registration
# types into the user's crate, so a macros release that is not this crate's
# own would not compile against it. Bump the two versions together.
scaling-macros = { version = "=0.10.2", path = "macros" }

[dev-dependencies]
expect-test = "1.5.1"

[workspace]
members = [".", "macros", "wasm/registrar", "wasm/runner"]

# A benchmark binary shaped the way one using this crate is meant to be:
# benchmarks declared where they are written, and a `main` of one call,
# `Config::default().run_and_print()`, for the whole program.
[[bench]]
name = "registered"
harness = false

# One codegen unit for the crate that registers benchmarks for `wasm/runner`.
# A wasm linker keeps an object file of a library only if something refers to
# it, and the runner refers to one static, so that must be the only object
# file holding registrations. See that crate.
[profile.release.package.scaling-wasm-registrar]
codegen-units = 1
