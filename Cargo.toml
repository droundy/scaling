[package]
name = "scaling"
version = "0.9.0"
authors = ["David Roundy <daveroundy@gmail.com>", "Alex Sayers <alex@asayers.com>"]
description = "A lightweight benchmarking library that measures scaling behavior"
edition = "2021"
documentation = "https://docs.rs/scaling/"
repository = "https://github.com/droundy/scaling"
readme = "README.md"
keywords = ["benchmark", "scaling"]
license = "MIT OR Apache-2.0"
# Set by `std::hint::black_box`, stabilised in 1.66. (`libc`, which we
# depend on only to pin benchmarks to a reserved CPU on Linux, wants 1.65.)
rust-version = "1.66"

# Only used to set CPU affinity, which only exists on Linux. Elsewhere this
# crate still has no dependencies at all.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Measures the library itself: what it costs to take a benchmark, and how
# reproducible the answer is. Not a `#[bench]` harness - it is a plain
# `main` that times `bench` with an `Instant`, because measuring the
# harness with the harness would hide a regression in the harness.
[[bench]]
name = "harness-cost"
harness = false
