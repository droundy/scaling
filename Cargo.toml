[package]
name = "scaling"
version = "0.9.0"
authors = ["David Roundy <daveroundy@gmail.com>", "Alex Sayers <alex@asayers.com>"]
description = "A lightweight benchmarking library that measures scaling behavior"
edition = "2021"
documentation = "https://docs.rs/scaling/"
repository = "https://github.com/droundy/scaling"
readme = "README.md"
keywords = ["benchmark", "scaling"]
license = "MIT OR Apache-2.0"
# Set by the dependencies below rather than by anything this crate does: the
# library itself compiles on 1.66, where `std::hint::black_box` was
# stabilised. `syn`, `quote`, `proc-macro2` and `unicode-ident` all declare
# 1.71; `inventory` declares 1.68.
rust-version = "1.71"

# Only used to set CPU affinity, which only exists on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies]
# Parses the command line for the runner - `--filter`, `--format`, the
# accuracy and budget flags. See `scaling::runner`.
auto-args = "0.3.2"
# Collects benchmarks registered anywhere in a crate, through linker
# sections, so that they need not be assembled into one list by hand. This is
# what makes `#[scaling::bench]` work from wherever it is written. See
# REGISTRATION.md.
inventory = "0.3.21"
# The attribute macros themselves.
scaling-macros = { version = "0.9.0", path = "macros" }

# These three were optional, behind `registry` and `cli` features, while the
# hand-assembled `Suite` was still a supported way to write benchmarks - a
# crate using only that path paid for neither. There is no such path now:
# registration is how a benchmark is declared and `scaling::runner` is how it
# is run, so every build needs all three and a feature to turn them off would
# only turn the crate off. See "Stage 8" in REGISTRATION.md.

[workspace]
members = [".", "macros"]

# Measures the library itself: what it costs to take a benchmark, and how
# reproducible the answer is. Not a registered suite - it is a plain `main`
# that times `bench` with an `Instant`, because measuring the harness with
# the harness would hide a regression in the harness.
[[bench]]
name = "harness-cost"
harness = false

# A benchmark binary shaped the way one using this crate is meant to be:
# benchmarks declared where they are written, and `scaling::main!()` for the
# whole program.
[[bench]]
name = "registered"
harness = false
