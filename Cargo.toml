[package]
name = "scaling"
version = "0.9.0"
authors = ["David Roundy <daveroundy@gmail.com>", "Alex Sayers <alex@asayers.com>"]
description = "A lightweight benchmarking library that measures scaling behavior"
edition = "2021"
documentation = "https://docs.rs/scaling/"
repository = "https://github.com/droundy/scaling"
readme = "README.md"
keywords = ["benchmark", "scaling"]
license = "MIT OR Apache-2.0"
# `#[expect]` was stabilized in Rust 1.81.
rust-version = "1.81"

# Only used to set CPU affinity, which only exists on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies]
inventory = "0.3.21"
scaling-macros = { version = "0.9.0", path = "macros" }

[workspace]
members = [".", "macros"]

# Measures the library itself: what it costs to take a benchmark, and how
# reproducible the answer is. Not a registered suite - it is a plain `main`
# that times `bench` with an `Instant`, because measuring the harness with
# the harness would hide a regression in the harness.
[[bench]]
name = "harness-cost"
harness = false

# A benchmark binary shaped the way one using this crate is meant to be:
# benchmarks declared where they are written, and `scaling::main!()` for the
# whole program.
[[bench]]
name = "registered"
harness = false
