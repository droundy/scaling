[package]
name = "scaling"
version = "0.9.0"
authors = ["David Roundy <daveroundy@gmail.com>", "Alex Sayers <alex@asayers.com>"]
description = "A lightweight benchmarking library that measures scaling behavior"
edition = "2021"
documentation = "https://docs.rs/scaling/"
repository = "https://github.com/droundy/scaling"
readme = "README.md"
keywords = ["benchmark", "scaling"]
license = "MIT OR Apache-2.0"
# Set by `std::hint::black_box`, stabilised in 1.66. (`libc`, which we
# depend on only to pin benchmarks to a reserved CPU on Linux, wants 1.65.)
rust-version = "1.66"

# Only used to set CPU affinity, which only exists on Linux. Elsewhere the
# default build of this crate still has no dependencies at all - `inventory`
# below is optional and off unless `registry` is enabled.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Collects benchmarks registered anywhere in a crate. Optional, so that a
# crate not using `registry` pays neither the dependency nor the linker
# machinery behind it. See REGISTRATION.md.
#
# It wants Rust 1.68 where this crate wants 1.66, so `registry` raises the
# floor for anyone who turns it on; the default build is unaffected and
# still compiles on 1.66.
[dependencies]
inventory = { version = "0.3.21", optional = true }
# The attribute macros. Optional for the same reason `inventory` is: a crate
# not using `registry` should pay for neither, and this one brings `syn` with
# it.
scaling-macros = { version = "0.9.0", path = "macros", optional = true }

# Measures the library itself: what it costs to take a benchmark, and how
# reproducible the answer is. Not a `#[bench]` harness - it is a plain
# `main` that times `bench` with an `Instant`, because measuring the
# harness with the harness would hide a regression in the harness.
[[bench]]
name = "harness-cost"
harness = false

[features]
# Discover benchmarks registered anywhere in a crate, rather than assembling
# them by hand into one `Suite`. See REGISTRATION.md.
registry = ["dep:inventory", "dep:scaling-macros"]

[workspace]
members = [".", "macros"]
