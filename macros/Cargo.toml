[package]
name = "scaling-macros"
version = "0.9.0"
authors = ["David Roundy <daveroundy@gmail.com>"]
description = "Attribute macros for the scaling benchmarking library"
edition = "2021"
documentation = "https://docs.rs/scaling/"
repository = "https://github.com/droundy/scaling"
license = "MIT OR Apache-2.0"
# `syn` 2 wants 1.61; this matches the rest of the workspace. The `registry`
# feature that pulls this in already needs 1.68 for `inventory`.
rust-version = "1.66"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
