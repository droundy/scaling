on: [push, pull_request]

name: Continuous integration

jobs:
  # One floor for the whole workspace. Set by the proc-macro dependencies
  # rather than by the library, which compiles well below it - so this is
  # checking a promise about the dependency tree as much as about the code.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.71.0
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all

  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      # One invocation, because there is now one way to build this. It used
      # to run twice, with and without the `registry` feature, to hold the
      # dependency-free default build honest; stage 8 removed the feature
      # along with the path it gated.
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all
