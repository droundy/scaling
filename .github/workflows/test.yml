on: [push, pull_request]

name: Continuous integration

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.81.0
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all

  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: -D warnings
        with:
          command: check
          args: --all --all-targets

  # Some code only compiles on Linux, and what is only used by that code is
  # dead anywhere else, which Linux cannot see.
  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: -D warnings
        with:
          command: check
          args: --all --all-targets

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all

  # Benchmarks are meant to run under wasm as well, through node's WASI, so
  # build them for it and run the registered ones.
  wasm:
    name: WebAssembly (WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-wasip1
          override: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rs/cargo@v1
        env:
          RUSTFLAGS: -D warnings
        with:
          command: check
          args: --target wasm32-wasip1 --workspace --all-targets
      - uses: actions-rs/cargo@v1
        with:
          command: bench
          args: --target wasm32-wasip1 --bench registered
      # Benchmarks registered in a dependency, which a wasm linker drops
      # unless the program refers to the crate. The native run is the control.
      - uses: actions-rs/cargo@v1
        with:
          command: run
          args: --release -p scaling-wasm-runner
      - uses: actions-rs/cargo@v1
        with:
          command: run
          args: --release --target wasm32-wasip1 -p scaling-wasm-runner
