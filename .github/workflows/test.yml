on: [push, pull_request]

name: Continuous integration

jobs:
  # One floor for the whole workspace. Set by the proc-macro dependencies
  # rather than by the library, which compiles well below it - so this is
  # checking a promise about the dependency tree as much as about the code.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.71.0
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all
      # serde_json's own declared MSRV is 1.71, matching this crate's own
      # floor exactly - so the `json` feature is checked at that floor too,
      # not just on whatever `stable` happens to be when CI runs.
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all --features json

  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all --features json

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      # Twice, default features and then `json` - `json` is optional
      # precisely so a caller who never asks for `--format json` pays for
      # neither `serde` nor `serde_json`, and only running the default
      # build here would leave that path, and the promise that its shape
      # tracks this crate's own semver, unverified by anything.
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all --features json
